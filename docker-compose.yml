services:
  db:
    image: postgres:16-alpine
    container_name: strength_log_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strength_log}
      POSTGRES_USER: ${POSTGRES_USER:-strength_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strength_user} -d ${POSTGRES_DB:-strength_log}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strength_log_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-strength_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-strength_log}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
