<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strength Log</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1F2937">
    <link rel="apple-touch-icon" href="/icon-192x192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://rsms.me/inter/inter.css');

        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #4B5563;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6B7280;
        }

        .form-input {
            transition: all 0.3s ease;
        }

        .form-input:focus {
            box-shadow: 0 0 0 2px #3b82f6;
            border-color: #3b82f6;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto max-w-2xl p-4 pt-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white">Strength Log</h1>
            <p class="text-lg text-gray-400">Log your workouts. See your progress.</p>
        </header>

        <div id="auth-card" class="bg-gray-800 shadow-xl rounded-lg overflow-hidden mb-6">
            <div class="p-6 border-b border-gray-700">
                <h2 class="text-2xl font-semibold mb-3 text-white">Sign In</h2>
                <p class="text-sm text-gray-400 mb-4">Create an account once, then log in with your email and password.
                </p>

                <form id="auth-form" class="space-y-4">
                    <div>
                        <label for="auth-email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                        <input id="auth-email" type="email" required
                            class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                            placeholder="you@example.com">
                    </div>
                    <div>
                        <label for="auth-password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                        <input id="auth-password" type="password" minlength="8" required
                            class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                            placeholder="At least 8 characters">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <button id="register-btn" type="button"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition disabled:opacity-50">Register</button>
                        <button id="login-btn" type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition disabled:opacity-50">Login</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="app-shell" class="bg-gray-800 shadow-xl rounded-lg overflow-hidden hidden">
            <div class="p-4 border-b border-gray-700 flex items-center justify-between">
                <p id="current-user" class="text-sm text-gray-300"></p>
                <button id="logout-btn"
                    class="text-sm bg-gray-700 hover:bg-gray-600 text-white py-2 px-3 rounded-md">Logout</button>
            </div>

            <form id="log-form" class="p-6 border-b border-gray-700">
                <h2 class="text-2xl font-semibold mb-5 text-white">Log a New Workout</h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="exercise" class="block text-sm font-medium text-gray-300 mb-1">Exercise</label>
                        <input type="text" id="exercise"
                            class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                            placeholder="e.g., Bench Press" required>
                    </div>
                    <div>
                        <label for="weight" class="block text-sm font-medium text-gray-300 mb-1">Weight (kg)</label>
                        <input type="number" id="weight" step="0.5" min="0"
                            class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                            placeholder="e.g., 60" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label for="sets" class="block text-sm font-medium text-gray-300 mb-1">Sets</label>
                        <input type="number" id="sets" min="1"
                            class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                            placeholder="e.g., 3" required>
                    </div>
                    <div>
                        <label for="reps" class="block text-sm font-medium text-gray-300 mb-1">Reps (per set)</label>
                        <input type="number" id="reps" min="1"
                            class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                            placeholder="e.g., 5" required>
                    </div>
                </div>

                <button type="submit" id="log-button"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-300 ease-in-out transform hover:-translate-y-0.5 disabled:opacity-50">
                    Log Workout
                </button>
            </form>

            <div class="p-6 border-b border-gray-700">
                <h2 class="text-2xl font-semibold mb-5 text-white">Progress Analysis</h2>
                <div>
                    <label for="exercise-select" class="block text-sm font-medium text-gray-300 mb-1">Select
                        Exercise</label>
                    <select id="exercise-select"
                        class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white transition">
                        <option value="">Loading exercises...</option>
                    </select>
                </div>
                <div class="mt-4 bg-gray-700 p-4 rounded-lg">
                    <canvas id="workout-chart"></canvas>
                </div>
            </div>

            <div class="p-6">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-2xl font-semibold text-white">Workout History</h2>
                    <span id="offline-indicator"
                        class="hidden text-xs font-medium bg-yellow-600 text-yellow-100 px-2 py-1 rounded-full">Offline</span>
                </div>
                <div id="loading-spinner" class="text-center text-gray-400 hidden">
                    <svg class="animate-spin h-5 w-5 text-white inline-block mr-2" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Loading history...
                </div>
                <div id="workout-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <div id="message-box"
        class="hidden fixed bottom-4 right-4 bg-red-600 text-white py-3 px-5 rounded-lg shadow-xl z-50">
        <span id="message-text"></span>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => { });
            });
        }

        const API_BASE_URL = '';
        const TOKEN_KEY = 'strength_log_token';
        const EMAIL_KEY = 'strength_log_email';

        const authCard = document.getElementById('auth-card');
        const appShell = document.getElementById('app-shell');
        const currentUser = document.getElementById('current-user');
        const authForm = document.getElementById('auth-form');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const registerBtn = document.getElementById('register-btn');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        const form = document.getElementById('log-form');
        const logButton = document.getElementById('log-button');
        const workoutList = document.getElementById('workout-list');
        const loadingSpinner = document.getElementById('loading-spinner');
        const exerciseInput = document.getElementById('exercise');
        const weightInput = document.getElementById('weight');
        const setsInput = document.getElementById('sets');
        const repsInput = document.getElementById('reps');

        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');
        const offlineIndicator = document.getElementById('offline-indicator');

        const exerciseSelect = document.getElementById('exercise-select');
        const chartCanvas = document.getElementById('workout-chart').getContext('2d');
        let chartInstance = null;
        let isOffline = !navigator.onLine;

        function getToken() {
            return localStorage.getItem(TOKEN_KEY);
        }

        function setAuth(token, email) {
            localStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(EMAIL_KEY, email);
            currentUser.textContent = `Signed in as ${email}`;
            authCard.classList.add('hidden');
            appShell.classList.remove('hidden');
            fetchWorkouts();
            loadExerciseDropdown();
        }

        function clearAuth() {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(EMAIL_KEY);
            authCard.classList.remove('hidden');
            appShell.classList.add('hidden');
            workoutList.innerHTML = '';
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
        }

        function showMessage(message, isError = true) {
            messageText.textContent = message;
            messageBox.className = `fixed bottom-4 right-4 text-white py-3 px-5 rounded-lg shadow-xl z-50 ${isError ? 'bg-red-600' : 'bg-green-600'}`;
            messageBox.classList.remove('hidden');
            setTimeout(() => messageBox.classList.add('hidden'), 3000);
        }

        async function apiFetch(path, options = {}) {
            const token = getToken();
            const headers = {
                ...(options.headers || {}),
                'Content-Type': 'application/json'
            };
            if (token) {
                headers.Authorization = `Bearer ${token}`;
            }

            const response = await fetch(`${API_BASE_URL}${path}`, {
                ...options,
                headers
            });

            if (response.status === 401) {
                clearAuth();
                showMessage('Your session expired. Please log in again.', true);
                throw new Error('Unauthorized');
            }

            return response;
        }

        async function register() {
            const payload = {
                email: authEmail.value.trim(),
                password: authPassword.value
            };

            registerBtn.disabled = true;
            try {
                const response = await apiFetch('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Registration failed');
                }
                setAuth(data.access_token, data.email);
                showMessage('Account created and logged in.', false);
                authForm.reset();
            } catch (error) {
                showMessage(error.message || 'Registration failed.', true);
            } finally {
                registerBtn.disabled = false;
            }
        }

        async function login(event) {
            event.preventDefault();
            const payload = {
                email: authEmail.value.trim(),
                password: authPassword.value
            };

            loginBtn.disabled = true;
            try {
                const response = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }
                setAuth(data.access_token, data.email);
                showMessage('Logged in successfully.', false);
                authForm.reset();
            } catch (error) {
                showMessage(error.message || 'Login failed.', true);
            } finally {
                loginBtn.disabled = false;
            }
        }

        async function fetchWorkouts() {
            if (isOffline) {
                showMessage('You are offline. Cannot load workouts.', true);
                workoutList.innerHTML = '<p class="text-center text-gray-400">Cannot load history while offline.</p>';
                return;
            }

            loadingSpinner.classList.remove('hidden');
            workoutList.innerHTML = '';
            try {
                const response = await apiFetch('/workouts');
                const workouts = await response.json();
                if (!response.ok) throw new Error('Failed to fetch workouts');

                if (workouts.length === 0) {
                    workoutList.innerHTML = '<p class="text-center text-gray-400">No workouts logged yet. Get started!</p>';
                } else {
                    workouts.forEach(renderWorkout);
                }
            } catch {
                workoutList.innerHTML = '<p class="text-center text-red-400">Failed to load history.</p>';
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            if (isOffline) {
                showMessage('You are offline. Cannot log workout.', true);
                return;
            }

            const workout = {
                exercise: exerciseInput.value,
                weight: parseFloat(weightInput.value),
                sets: parseInt(setsInput.value, 10),
                reps: parseInt(repsInput.value, 10)
            };

            logButton.disabled = true;
            logButton.textContent = 'Logging...';

            try {
                const response = await apiFetch('/workouts', {
                    method: 'POST',
                    body: JSON.stringify(workout)
                });
                const newWorkout = await response.json();
                if (!response.ok) throw new Error('Failed to log workout');

                if (workoutList.querySelector('p')) {
                    workoutList.innerHTML = '';
                }
                renderWorkout(newWorkout, true);
                form.reset();
                showMessage('Workout logged successfully.', false);
                loadExerciseDropdown();
            } catch {
                showMessage('Failed to log workout. Please try again.', true);
            } finally {
                logButton.disabled = false;
                logButton.textContent = 'Log Workout';
            }
        }

        async function deleteWorkout(id, workoutCard) {
            if (isOffline) {
                showMessage('You are offline. Cannot delete workout.', true);
                return;
            }

            const originalHeight = workoutCard.offsetHeight;
            workoutCard.style.height = `${originalHeight}px`;
            workoutCard.style.transition = 'all 0.3s ease-out';
            workoutCard.style.opacity = '0';
            workoutCard.style.transform = 'translateX(-100%)';
            workoutCard.style.padding = '0';
            workoutCard.style.margin = '0';

            setTimeout(() => {
                workoutCard.remove();
                if (workoutList.children.length === 0) {
                    workoutList.innerHTML = '<p class="text-center text-gray-400">No workouts logged yet. Get started!</p>';
                }
                loadExerciseDropdown();
            }, 300);

            try {
                const response = await apiFetch(`/workouts/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete workout');
                showMessage('Workout deleted.', false);
            } catch {
                showMessage('Failed to delete on server. Please refresh.', true);
            }
        }

        async function loadExerciseDropdown() {
            if (isOffline) {
                exerciseSelect.innerHTML = '<option value="">Cannot load exercises offline</option>';
                return;
            }

            try {
                const response = await apiFetch('/exercises');
                const exercises = await response.json();
                if (!response.ok) throw new Error('Failed to fetch exercises');

                exerciseSelect.innerHTML = '<option value="">-- Select an exercise --</option>';
                if (exercises.length === 0) {
                    exerciseSelect.innerHTML = '<option value="">-- Log a workout first --</option>';
                }

                exercises.forEach((exercise) => {
                    const option = document.createElement('option');
                    option.value = exercise;
                    option.textContent = exercise;
                    exerciseSelect.appendChild(option);
                });
            } catch {
                exerciseSelect.innerHTML = '<option value="">Error loading exercises</option>';
            }
        }

        async function updateChart(exerciseName) {
            if (!exerciseName) {
                if (chartInstance) chartInstance.destroy();
                return;
            }
            if (isOffline) {
                showMessage('You are offline. Cannot load analysis.', true);
                return;
            }

            try {
                const response = await apiFetch(`/analysis?exercise=${encodeURIComponent(exerciseName)}`);
                const data = await response.json();
                if (!response.ok) throw new Error('Failed to fetch analysis data');

                if (chartInstance) chartInstance.destroy();

                chartInstance = new Chart(chartCanvas, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: `Weight Lifted (kg) for ${exerciseName}`,
                            data: data.data,
                            backgroundColor: 'rgba(59, 130, 246, 0.2)',
                            borderColor: 'rgba(59, 130, 246, 1)',
                            borderWidth: 2,
                            tension: 0.1,
                            pointBackgroundColor: 'rgba(59, 130, 246, 1)'
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: false,
                                title: { display: true, text: 'Weight (kg)', color: '#9CA3AF' },
                                ticks: { color: '#9CA3AF' },
                                grid: { color: 'rgba(156, 163, 175, 0.1)' }
                            },
                            x: {
                                title: { display: true, text: 'Date', color: '#9CA3AF' },
                                ticks: { color: '#9CA3AF' },
                                grid: { color: 'rgba(156, 163, 175, 0.1)' }
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#1F2937',
                                titleColor: '#F9FAFB',
                                bodyColor: '#D1D5DB'
                            }
                        },
                        responsive: true,
                        maintainAspectRatio: true
                    }
                });
            } catch {
                showMessage('Failed to load chart data.', true);
            }
        }

        function renderWorkout(workout, prepend = false) {
            const workoutCard = document.createElement('div');
            workoutCard.className = 'bg-gray-700 p-4 rounded-lg flex justify-between items-center transition-all duration-300';
            const date = new Date(workout.log_date * 1000);
            const formattedDate = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
            const formattedTime = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

            workoutCard.innerHTML = `
                <div>
                    <h3 class="text-lg font-semibold text-white">${workout.exercise_name}</h3>
                    <p class="text-sm text-gray-300">${workout.sets} sets &times; ${workout.reps} reps @ ${workout.weight_kg} kg</p>
                    <p class="text-xs text-gray-400 mt-1">${formattedDate}, ${formattedTime}</p>
                </div>
                <button class="delete-btn text-gray-400 hover:text-red-500 transition-all p-1 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            `;

            workoutCard.querySelector('.delete-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                deleteWorkout(workout.id, workoutCard);
            });

            if (prepend) {
                workoutList.prepend(workoutCard);
            } else {
                workoutList.appendChild(workoutCard);
            }
        }

        function updateOnlineStatus() {
            isOffline = !navigator.onLine;
            if (isOffline) {
                offlineIndicator.classList.remove('hidden');
                logButton.disabled = true;
                logButton.textContent = 'Offline';
            } else {
                offlineIndicator.classList.add('hidden');
                logButton.disabled = false;
                logButton.textContent = 'Log Workout';
            }
        }

        registerBtn.addEventListener('click', register);
        authForm.addEventListener('submit', login);
        logoutBtn.addEventListener('click', () => {
            clearAuth();
            showMessage('Logged out.', false);
        });
        form.addEventListener('submit', handleFormSubmit);
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        exerciseSelect.addEventListener('change', (e) => updateChart(e.target.value));

        updateOnlineStatus();
        const existingToken = getToken();
        const existingEmail = localStorage.getItem(EMAIL_KEY);
        if (existingToken && existingEmail) {
            setAuth(existingToken, existingEmail);
        }
    </script>
</body>

</html>
