<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strength Log</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1F2937">
    <link rel="apple-touch-icon" href="/icon-192x192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto max-w-2xl p-4 pt-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white">Strength Log</h1>
            <p class="text-lg text-gray-400">Log your workouts. See your progress.</p>
        </header>

        <div id="auth-card" class="bg-gray-800 shadow-xl rounded-lg overflow-hidden mb-6">
            <div class="p-6 border-b border-gray-700">
                <h2 class="text-2xl font-semibold mb-3 text-white">Sign In</h2>
                <p class="text-sm text-gray-400 mb-4">Create an account once, then log in with your email and password.
                </p>

                <form id="auth-form" class="space-y-4">
                    <div>
                        <label for="auth-email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                        <input id="auth-email" type="email" required
                            class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                            placeholder="you@example.com">
                    </div>
                    <div>
                        <label for="auth-password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                        <input id="auth-password" type="password" minlength="8" required
                            class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                            placeholder="At least 8 characters">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <button id="register-btn" type="button"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition disabled:opacity-50">Register</button>
                        <button id="login-btn" type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition disabled:opacity-50">Login</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="app-shell" class="bg-gray-800 shadow-xl rounded-lg overflow-hidden hidden">
            <div class="p-4 border-b border-gray-700 flex items-center justify-between">
                <p id="current-user" class="text-sm text-gray-300"></p>
                <button id="logout-btn"
                    class="text-sm bg-gray-700 hover:bg-gray-600 text-white py-2 px-3 rounded-md">Logout</button>
            </div>

            <div class="border-b border-gray-700">
                <button type="button"
                    class="section-toggle w-full flex items-center justify-between px-6 py-4 text-left text-white"
                    data-target="log-section" aria-expanded="true">
                    <span class="text-2xl font-semibold">Log a New Workout</span>
                    <span class="chevron text-xl">▾</span>
                </button>
                <div id="log-section" class="section-content">
                    <form id="log-form" class="px-6 pb-6 pt-1">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label for="exercise"
                                    class="block text-sm font-medium text-gray-300 mb-1">Exercise</label>
                                <input type="text" id="exercise"
                                    class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                                    placeholder="e.g., Bench Press" required>
                            </div>
                            <div>
                                <label for="weight" class="block text-sm font-medium text-gray-300 mb-1">Weight
                                    (kg)</label>
                                <input type="number" id="weight" step="0.5" min="0"
                                    class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                                    placeholder="e.g., 60" required>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div>
                                <label for="sets" class="block text-sm font-medium text-gray-300 mb-1">Sets</label>
                                <input type="number" id="sets" min="1"
                                    class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                                    placeholder="e.g., 3" required>
                            </div>
                            <div>
                                <label for="reps" class="block text-sm font-medium text-gray-300 mb-1">Reps</label>
                                <input type="number" id="reps" min="1"
                                    class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white"
                                    placeholder="e.g., 5" required>
                            </div>
                        </div>

                        <button type="submit" id="log-button"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-300 ease-in-out transform hover:-translate-y-0.5 disabled:opacity-50">
                            Log Workout
                        </button>
                    </form>
                </div>
            </div>

            <div class="border-b border-gray-700">
                <button type="button"
                    class="section-toggle w-full flex items-center justify-between px-6 py-4 text-left text-white"
                    data-target="analysis-section" aria-expanded="true">
                    <span class="text-2xl font-semibold">Progress Analysis</span>
                    <span class="chevron text-xl">▾</span>
                </button>
                <div id="analysis-section" class="section-content px-6 pb-6 pt-1">
                    <div>
                        <label for="exercise-select" class="block text-sm font-medium text-gray-300 mb-1">Select
                            Exercise</label>
                        <select id="exercise-select"
                            class="form-input w-full bg-gray-700 border border-gray-600 rounded-md p-2 text-white transition">
                            <option value="">Loading exercises...</option>
                        </select>
                    </div>
                    <div class="mt-4 bg-gray-700 p-4 rounded-lg">
                        <svg id="workout-chart" class="w-full h-72"></svg>
                    </div>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between px-6 py-4">
                    <button type="button" class="section-toggle flex items-center gap-3 text-left text-white"
                        data-target="history-section" aria-expanded="true">
                        <span class="text-2xl font-semibold">Workout History</span>
                        <span class="chevron text-xl">▾</span>
                    </button>
                    <span id="offline-indicator"
                        class="hidden text-xs font-medium bg-yellow-600 text-yellow-100 px-2 py-1 rounded-full">Offline</span>
                </div>
                <div id="history-section" class="section-content px-6 pb-6 pt-1">
                    <div id="loading-spinner" class="text-center text-gray-400 hidden">
                        <svg class="animate-spin h-5 w-5 text-white inline-block mr-2"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Loading history...
                    </div>
                    <div id="workout-list" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="message-box"
        class="hidden fixed bottom-4 right-4 bg-red-600 text-white py-3 px-5 rounded-lg shadow-xl z-50">
        <span id="message-text"></span>
    </div>
    <script src="/app.js?v=20260403"></script>
</body>

</html>
